<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campeões da Copa do Mundo FIFA</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #0f172a;
      color: white;
    }

    header {
      background: linear-gradient(135deg, #006400, #00a651);
      text-align: center;
      padding: 60px 20px;
    }

    header h1 {
      font-size: 3rem;
      margin-bottom: 15px;
    }

    header p {
      font-size: 1.2rem;
    }

    .container {
      width: 90%;
      max-width: 1200px;
      margin: auto;
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin-top: 40px;
      margin-bottom: 40px;
    }

    .stat-box {
      flex: 1;
      min-width: 220px;
      background: #1e293b;
      padding: 20px;
      text-align: center;
      border-radius: 15px;
    }

    .stat-box h2 {
      color: #22c55e;
      font-size: 2rem;
    }

    .search {
      margin-bottom: 30px;
    }

    .search input {
      width: 100%;
      padding: 15px;
      border-radius: 10px;
      border: none;
      font-size: 16px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 50px;
    }

    .card {
      background: #1e293b;
      border-radius: 15px;
      padding: 20px;
      transition: 0.3s;
      text-align: center;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .flag {
      font-size: 50px;
      margin-bottom: 10px;
    }

    .card h3 {
      margin-bottom: 10px;
      color: #22c55e;
    }

    .card p {
      margin: 5px 0;
    }

    footer {
      background: #020617;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>

<body>

  <header>
    <h1>🏆 Campeões da Copa do Mundo FIFA</h1>
    <p>História dos maiores vencedores do futebol mundial</p>
  </header>

  <div class="container">

    <section class="stats">
      <div class="stat-box">
        <h2>22</h2>
        <p>Copas Realizadas</p>
      </div>

      <div class="stat-box">
        <h2>8</h2>
        <p>Países Campeões</p>
      </div>

      <div class="stat-box">
        <h2>5</h2>
        <p>Títulos do Brasil</p>
      </div>
    </section>

    <section class="search">
      <input type="text" id="pesquisa" placeholder="Pesquisar campeão...">
    </section>

    <section class="cards" id="cards"></section>

  </div>

  <footer>
    Desenvolvido por Bruno Rapozo • Projeto Acadêmico FIFA World Cup Champions
  </footer>

  <script>
    const campeoes = [
      {
        pais: "Brasil",
        bandeira: "🇧🇷",
        titulos: 5,
        anos: "1958, 1962, 1970, 1994, 2002"
      },
      {
        pais: "Alemanha",
        bandeira: "🇩🇪",
        titulos: 4,
        anos: "1954, 1974, 1990, 2014"
      },
      {
        pais: "Itália",
        bandeira: "🇮🇹",
        titulos: 4,
        anos: "1934, 1938, 1982, 2006"
      },
      {
        pais: "Argentina",
        bandeira: "🇦🇷",
        titulos: 3,
        anos: "1978, 1986, 2022"
      },
      {
        pais: "França",
        bandeira: "🇫🇷",
        titulos: 2,
        anos: "1998, 2018"
      },
      {
        pais: "Uruguai",
        bandeira: "🇺🇾",
        titulos: 2,
        anos: "1930, 1950"
      },
      {
        pais: "Inglaterra",
        bandeira: "🏴",
        titulos: 1,
        anos: "1966"
      },
      {
        pais: "Espanha",
        bandeira: "🇪🇸",
        titulos: 1,
        anos: "2010"
      }
    ];

    const cards = document.getElementById("cards");
    const pesquisa = document.getElementById("pesquisa");

    function mostrarCampeoes(lista) {
      cards.innerHTML = "";

      lista.forEach(item => {
        cards.innerHTML += `
        <div class="card">
          <div class="flag">${item.bandeira}</div>
          <h3>${item.pais}</h3>
          <p><strong>Títulos:</strong> ${item.titulos}</p>
          <p><strong>Anos:</strong></p>
          <p>${item.anos}</p>
        </div>
        `;
      });
    }

    mostrarCampeoes(campeoes);

    pesquisa.addEventListener("keyup", () => {
      const valor = pesquisa.value.toLowerCase();

      const filtrado = campeoes.filter(c =>
        c.pais.toLowerCase().includes(valor)
      );

      mostrarCampeoes(filtrado);
    });
  </script>

</body>

</html>
