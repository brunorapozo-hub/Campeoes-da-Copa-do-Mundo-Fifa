<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Campeões da Copa do Mundo FIFA</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#0f172a;
color:white;
}

header{
background:linear-gradient(135deg,#006400,#00a651);
padding:70px 20px;
text-align:center;
}

header h1{
font-size:3rem;
margin-bottom:15px;
}

header p{
font-size:1.2rem;
}

.container{
width:90%;
max-width:1200px;
margin:auto;
padding:30px 0;
}

.section-title{
margin:40px 0 20px;
color:#22c55e;
font-size:2rem;
}

.stats{
display:flex;
gap:20px;
flex-wrap:wrap;
margin:30px 0;
}

.stat-box{
flex:1;
min-width:220px;
background:#1e293b;
padding:20px;
border-radius:15px;
text-align:center;
}

.stat-box h2{
color:#22c55e;
font-size:2rem;
}

.search input{
width:100%;
padding:15px;
border:none;
border-radius:10px;
font-size:16px;
margin-bottom:30px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:#1e293b;
padding:20px;
border-radius:15px;
text-align:center;
transition:.3s;
}

.card:hover{
transform:translateY(-5px);
}

.flag{
font-size:50px;
margin-bottom:10px;
}

.card h3{
color:#22c55e;
margin-bottom:10px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:15px;
}

table th{
background:#00a651;
}

table th,
table td{
padding:12px;
border:1px solid #334155;
text-align:center;
}

footer{
background:#020617;
text-align:center;
padding:25px;
margin-top:50px;
}

</style>
</head>

<div class="cards" id="cards"></div>
